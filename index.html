    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      html {
        scroll-behavior: smooth;
      }
      /* Custom scrollbar for a more branded feel */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a102c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #e677af;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #8073f1;
      }
      /* Hide arrows from number input */
      .hide-arrows::-webkit-outer-spin-button,
      .hide-arrows::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .hide-arrows {
        -moz-appearance: textfield;
      }
      /* Custom Slider Styles */
      .custom-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 24px;
        height: 24px;
        background: #e677af; /* brand-pink */
        border: 2px solid #8073f1; /* brand-purple */
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
        margin-top: -9px; /* center thumb on track */
      }
      .custom-slider:focus::-webkit-slider-thumb {
         box-shadow: 0 0 0 4px rgba(230, 119, 175, 0.5);
      }
      .custom-slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: #e677af; /* brand-pink */
        border: 2px solid #8073f1; /* brand-purple */
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }
      .custom-slider:focus::-moz-range-thumb {
         box-shadow: 0 0 0 4px rgba(230, 119, 175, 0.5);
      }
      
      /* --- GOOGLE TRANSLATE HIDDEN CUSTOMIZATION --- */
      
      /* 1. Hide the top banner frame created by Google */
      .goog-te-banner-frame.skiptranslate {
          display: none !important;
      }
      
      /* 2. Hide ANY iframe that Google Translate injects (skiptranslate class is key) */
      iframe.skiptranslate {
          display: none !important;
          visibility: hidden !important;
          height: 0 !important;
          width: 0 !important;
          opacity: 0 !important;
          pointer-events: none !important;
      }

      /* 3. Hide specific Google Translate container classes often found in body */
      .VIpgJd-ZVi9od-ORHb-OEVmcd {
          display: none !important;
          visibility: hidden !important;
      }

      /* 4. Ensure body doesn't get pushed down */
      body {
          top: 0px !important;
          position: static !important;
      }
      
      /* 5. Hide the widget element itself */
      #google_translate_element {
          display: none !important;
      }
      
      /* 6. Hide tooltips and other popups */
      .goog-te-gadget {
          display: none !important;
      }
      .goog-tooltip {
          display: none !important;
      }
      .goog-tooltip:hover {
          display: none !important;
      }
      .goog-text-highlight {
          background-color: transparent !important;
          box-shadow: none !important;
      }
      
      /* 7. Hide "Original text" popup */
      #goog-gt-tt {
          display: none !important;
          visibility: hidden !important;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'sans': ['Poppins', 'sans-serif'],
            },
            colors: {
              'brand-purple': '#8073f1',
              'brand-pink': '#e677af',
              'brand-dark': '#120c1f', // Darker background for more contrast
              'brand-dark-200': '#1e1433',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              backgroundPulse: {
                '0%, 100%': { 'background-position': '0% 50%' },
                '50%': { 'background-position': '100% 50%' },
              },
               shine: {
                '0%': { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
            },
            animation: {
              fadeInUp: 'fadeInUp 0.8s ease-out forwards',
              backgroundPulse: 'backgroundPulse 10s ease infinite',
              shine: 'shine 1.5s linear infinite',
            },
          }
        }
      }
    </script>
  <script type="importmap">

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'pt', 
          includedLanguages: 'pt,en,ja', 
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
